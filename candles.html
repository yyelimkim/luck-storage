<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blowing Candles</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="design-system.css?v=9">
  <link rel="stylesheet" href="candles.css?v=8">
</head>
<body>
  <!-- Blowing out the candles (Figma 436:8748, 436:8802, 438:289, 436:8856,
       436:8907): the cake; a wish written over it; the cake comes close and
       a hand shows the swipe; the flames bend as they're blown; smoke rises
       and the wish comes true. -->
  <main class="candles" id="candles" data-step="intro">
    <div class="candles--stage">
      <div class="candles--scene" id="scene">
        <img class="candles--cake" src="assets/candles/cake.svg" alt="A birthday cake with five lit candles">
        <!-- Where to swipe, and a hand showing how -->
        <div class="candles--band" aria-hidden="true"></div>
        <img class="candles--hand" src="assets/candles/hand.svg" alt="">
      </div>
      <!-- The wish, written over the softened cake -->
      <div class="candles--veil" aria-hidden="true"></div>
      <form class="candles--wish" id="wish-form">
        <input id="wish" type="text" maxlength="60" placeholder="I wish…" autocomplete="off" aria-label="What’s your wish?">
        <button type="submit" class="candles--send" id="send" aria-label="Make the wish" disabled>
          <svg width="20" height="20" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13V3M3.5 7.5L8 3l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </form>
    </div>

    <!-- Under the cake: what this step is -->
    <div class="candles--words" role="status">
      <p class="candles--ask">What’s your wish?</p>
      <p class="candles--hint" id="hint">Blow them all out in one go!</p>
      <div class="candles--done">
        <p class="candles--congrats">Congratulations, your wish came true</p>
        <p class="candles--echo" id="echo"></p>
      </div>
    </div>
  </main>
  <script src="sounds.js?v=16"></script>
  <script src="candles.js?v=8"></script>
</body>
</html>
