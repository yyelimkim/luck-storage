  <title>Wearing Red</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">

<body>
  <!-- Wearing Red (Figma 529:685; the figure 529:819, its bottoms 529:845/
       545/553/502, its shoes 529:616/617/618): swipe the bottoms or the
       shoes, or tap their arrows, to try them on. In red bottoms and red
       shoes, it's done. -->
  <main class="wr" id="wr" data-step="dress">
    <div class="wr--fig" id="fig"></div>
    <div class="wr--fade" aria-hidden="true"></div>
    <div class="wr--words" role="status">
      <p class="wr--say" data-for="dress">Swipe to dress them in red</p>
      <p class="wr--say" data-for="done">All in red. Luck’s on your side</p>
    </div>
  </main>
  <script src="sounds.js?v=30"></script>
  <script src="wearred.js?v=7"></script>
</body>
