<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Evil Eye</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="design-system.css?v=9">
  <link rel="stylesheet" href="charm.css?v=20">
  <link rel="stylesheet" href="evileye.css?v=10">
</head>
<body>
  <!-- Evil Eye (Figma 519:247), hung as the pollock charm is: it drops on its
       string, threaded through the hole at the top of the eye and knotted,
       and is caught when the string runs out. Hit it to knock the bad luck
       into it, and with each hit a crack runs further across it; drag it to
       pull it around, tap the empty canvas to drop it again. -->
  <div class="progress" id="progress" role="progressbar" aria-label="Luck" aria-valuemin="0" aria-valuemax="5" aria-valuenow="0">
    <div class="progress--track"><span class="progress--fill" id="progress-fill"></span></div>
    <img class="progress--clover" id="progress-clover" src="assets/mobile/clover-outline.svg" width="28" height="28" alt="">
  </div>
  <main class="stage" id="stage">
    <div class="charm--fit">
      <div class="charm eye" id="charm">
        <div class="charm--fish" id="fish"></div>
      </div>
    </div>
  </main>
  <script src="sounds.js?v=24"></script>
  <script src="pointer.js?v=1"></script>
  <script src="evileye.js?v=15"></script>
  <script src="charm.js?v=26"></script>
</body>
</html>
