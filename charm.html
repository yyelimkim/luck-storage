<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fish Charm</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="design-system.css?v=9">
  <link rel="stylesheet" href="charm.css?v=21">
</head>
<body>
  <!-- Blank canvas: the fish charm (Figma 271:1240) drops from the hand on its straight string,
       which is puppet-warped as it goes slack and snaps taut.
       Click it to hit it, drag it to pull it around, click the empty canvas to drop it again. -->
  <!-- How much bad luck is knocked loose: each hit fills it a step; full, the luck is claimed -->
  <div class="progress" id="progress" role="progressbar" aria-label="Luck" aria-valuemin="0" aria-valuemax="5" aria-valuenow="0">
    <div class="progress--track"><span class="progress--fill" id="progress-fill"></span></div>
    <img class="progress--clover" id="progress-clover" src="assets/mobile/clover-outline.svg" width="28" height="28" alt="">
  </div>
  <main class="stage" id="stage">
    <div class="charm" id="charm">
      <div class="charm--fish" id="fish"></div>
    </div>
  </main>
  <script src="sounds.js?v=30"></script>
  <script src="pointer.js?v=1"></script>
  <script src="charm.js?v=26"></script>
</body>
</html>
