<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Luck Storage</title>
  <link rel="stylesheet" href="style.css?v=21">
</head>
<body>
  <header class="nav">
    <!-- Home: also closes an open card -->
    <a href="#" class="nav--btn nav--home" id="close" aria-label="Home">
      <img src="assets/nav-clover.svg" width="41" height="41" alt="">
    </a>
    <h1 class="nav--title">행복보관소</h1>
    <div class="nav--right">
      <a href="#" class="nav--btn nav--list" id="view-strip" aria-label="Strip view">
        <span></span><span></span><span></span>
      </a>
      <a href="#" class="nav--btn nav--grid" id="view-grid" aria-label="Grid view">
        <span></span><span></span><span></span><span></span>
      </a>
    </div>
  </header>

  <main class="showcase">
    <div class="showcase--cards" id="cards"></div>
  </main>

  <!-- Grid view: every card at once -->
  <section class="grid" id="grid"></section>

  <!-- Opened card: flipped card on the left, interaction canvas on the right -->
  <section class="viewer" id="viewer">
    <div class="viewer--left" id="viewer-left"></div>
    <div class="viewer--canvas" id="canvas"></div>
  </section>

  <!-- One line per card: hover or drag along it to scrub the strip -->
  <nav class="scroller" id="scroller" aria-label="Cards"></nav>

  <script src="script.js?v=21"></script>
</body>
</html>
