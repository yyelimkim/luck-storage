<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f0f0f0">
  <title>행운보관소</title>
  <link rel="stylesheet" href="design-system.css?v=7">
  <link rel="stylesheet" href="mobile.css?v=108">
</head>
<body>
  <!-- iPhone 17 screen (Figma 97:630 at rest, 97:730 while dialing), laid out at
       402 x 874 and scaled to fit by mobile.js -->
  <div class="stage" id="stage">
    <!-- Fake status bar: only shown in the desktop preview frame -->
    <div class="status">
      <span class="status--time">9:41</span>
      <img class="status--right" src="assets/mobile/status-right.svg" width="66.661" height="11.3363" alt="">
    </div>

    <!-- Header (Figma 376:5496): which cards, and the luck claimed so far -->
    <header class="head">
      <!-- On the profile, settings and the wardrobe take the deck name's place -->
      <div class="head--tools">
        <button type="button" aria-label="Settings"><img src="assets/profile/settings.svg?v=2" width="28" height="28" alt=""></button>
        <button type="button" aria-label="Wardrobe"><img src="assets/profile/hanger.svg" width="28" height="28" alt=""></button>
      </div>
      <button type="button" class="head--title" aria-haspopup="dialog" aria-expanded="false">
        <h1>All Cards</h1>
        <img src="assets/mobile/chevron.svg" width="13.3333" height="7.33333" alt="">
      </button>
      <div class="head--count" id="count">
        <img src="assets/mobile/clover-outline.svg" width="22" height="22" alt="">
        <span id="count-num">12</span>
      </div>
    </header>

    <!-- Cards fan around the dial's centre -->
    <div class="fan" id="fan"></div>

    <!-- Dial: press to open it, turn it to spin the cards -->
    <div class="dial" id="dial" role="slider" aria-label="Cards" tabindex="0">
    </div>

    <!-- Profile (Figma 390:6966): who you are, today's fortune, recent luck -->
    <section class="profile" id="profile" aria-label="Profile">
      <div class="profile--hero">
        <p class="profile--hello" id="hello">Good Morning,</p>
        <h2 class="profile--name">Yelim <button type="button" aria-label="Edit name"><img src="assets/profile/pencil-name.svg" width="23" height="24" alt=""></button></h2>
        <img class="profile--avatar" src="assets/profile/avatar.svg" width="144" height="254" alt="">
      </div>
      <div class="profile--body">
        <h3 class="profile--label">Daily Fortune</h3>
        <button type="button" class="profile--fortune">
          <img class="profile--clouds" src="assets/profile/fortune-clouds.svg" width="371" height="143" alt="">
          <img class="profile--dial" src="assets/profile/fortune-dial.svg" width="147" height="143" alt="">
          <span class="profile--date" id="today"></span>
          <span class="profile--find">Find out your fortune for today!</span>
          <img class="profile--go" src="assets/profile/arrow-right.svg" width="18" height="18" alt="">
        </button>
        <h3 class="profile--label">Recently Earned Luck</h3>
        <div class="profile--recent">
          <div class="profile--earned" style="--earned: var(--yellow-green)">
            <img src="assets/profile/pollock.svg" width="88" height="85" alt="">
            <p>Pollock Protection<br>Charm</p>
          </div>
          <div class="profile--earned" style="--earned: var(--v2-blue)">
            <img src="assets/profile/stones.svg" width="103" height="102" alt="">
            <p>Stacking<br>Stones</p>
          </div>
          <div class="profile--earned" style="--earned: var(--forest-green)">
            <img src="assets/profile/buddha.svg" width="111" height="109" alt="">
            <p>Rubbing<br>Buddha’s Belly</p>
          </div>
          <div class="profile--earned" style="--earned: var(--v2-blue)">
            <img src="assets/profile/pig.svg" width="90.58" height="87.24" alt="">
            <p>Pig<br>Dreams</p>
          </div>
        </div>
      </div>
    </section>

    <!-- Daily Fortune (Figma 395:7512, 395:7550, 397:208): opened from the
         profile's fortune card. The clover ring fills while today's fortune
         loads, the clovers turn yellow and "See Fortune!" opens the reading. -->
    <section class="fortune" id="fortune" aria-label="Daily Fortune" aria-hidden="true" data-step="loading">
      <div class="fortune--bar">
        <button type="button" class="fortune--back" aria-label="Back">
          <img src="assets/fortune/back.svg" width="28" height="28" alt="">
        </button>
        <h2 class="fortune--title">Daily Fortune</h2>
      </div>
      <div class="fortune--intro">
        <p class="fortune--pill fortune--today"></p>
        <div class="fortune--ring" aria-hidden="true">
          <img class="fortune--ring-line" src="assets/fortune/ring.svg" width="253" height="253" alt="">
          <svg class="fortune--arc" width="248" height="248" viewBox="0 0 248 248" fill="none">
            <path d="M124 3.5A120.5 120.5 0 1 1 124 244.5A120.5 120.5 0 1 1 124 3.5" pathLength="100" stroke="currentColor" stroke-width="7" stroke-linecap="round"/>
          </svg>
          <span class="fortune--clover fortune--clover-big">
            <img class="is-off" src="assets/fortune/clover-big-off.svg" width="88.1547" height="88.1547" alt="">
            <img class="is-on" src="assets/fortune/clover-big-on.svg?v=2" width="88.1547" height="88.1547" alt="">
          </span>
          <span class="fortune--clover fortune--clover-small">
            <img class="is-off" src="assets/fortune/clover-small-off.svg" width="31.6444" height="31.6444" alt="">
            <img class="is-on" src="assets/fortune/clover-small-on.svg?v=2" width="31.6444" height="31.6444" alt="">
          </span>
        </div>
        <button type="button" class="fortune--see" id="fortune-see" disabled>
          <span class="is-off">Loading...</span><span class="is-on">See Fortune!</span>
        </button>
        <label class="fortune--birth">
          <span id="fortune-birth"></span>
          <img src="assets/fortune/pencil.svg" width="14" height="14" alt="">
          <input type="date" id="fortune-birth-input" aria-label="Birthday">
        </label>
      </div>
      <div class="fortune--result">
        <p class="fortune--pill fortune--today"></p>
        <div class="fortune--hero" aria-hidden="true">
          <img class="fortune--coin fortune--coin-left" src="assets/fortune/coin-left.svg" width="48.916" height="48.916" alt="">
          <img class="fortune--coin fortune--coin-right" src="assets/fortune/coin-right.svg" width="103.076" height="103.076" alt="">
          <img class="fortune--pig-shadow" src="assets/fortune/pig-shadow.svg" width="142.885" height="10.4335" alt="">
          <img class="fortune--pig" src="assets/fortune/pig.svg" width="188.837" height="182.295" alt="">
        </div>
        <div class="fortune--card fortune--read">
          <p class="fortune--headline" id="fortune-headline"></p>
          <p class="fortune--body" id="fortune-body"></p>
        </div>
        <div class="fortune--tiles">
          <button type="button" class="fortune--card fortune--tile fortune--ritual" id="fortune-ritual">
            <span class="fortune--label">Lucky Ritual</span>
            <span class="fortune--art" id="fortune-art"></span>
            <span class="fortune--ritual-name"><span id="fortune-ritual-name"></span><img src="assets/fortune/arrow.svg" width="18" height="18" alt=""></span>
          </button>
          <div class="fortune--card fortune--tile fortune--colour">
            <span class="fortune--label">Lucky Color</span>
            <span class="fortune--swatch" id="fortune-swatch"></span>
            <span class="fortune--swatch-name" id="fortune-colour"></span>
          </div>
        </div>
      </div>
    </section>

    <!-- Behind the tab bar: what scrolls under it blurs away -->
    <div class="m-navfade" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

    <!-- Tab bar (Figma 376:5524): icons only, the current one filled -->
    <nav class="m-nav" aria-label="Sections">
      <button type="button" class="m-nav--tab" data-tab="tree" aria-label="Tree">
        <img class="is-off" src="assets/nav/tree-off.svg" width="26" height="26" alt="">
        <img class="is-on" src="assets/nav/tree-on.svg" width="26" height="26" alt="">
      </button>
      <button type="button" class="m-nav--tab" data-tab="home" aria-label="Home" aria-current="page">
        <img class="is-off" src="assets/nav/home-off.svg" width="19.0585" height="20.363" alt="">
        <img class="is-on" src="assets/nav/home-on.svg" width="19.0586" height="20.3634" alt="">
      </button>
      <button type="button" class="m-nav--tab" data-tab="profile" aria-label="Profile">
        <img class="is-off" src="assets/nav/profile-off.svg" width="17.0829" height="18.5" alt="">
        <img class="is-on" src="assets/nav/profile-on.svg" width="17.0829" height="18.5" alt="">
      </button>
    </nav>

    <!-- Filter (the header's deck name): pick a category, then Done -->
    <div class="filter" id="filter" aria-hidden="true">
      <div class="filter--scrim"></div>
      <div class="filter--sheet" role="dialog" aria-label="Filter">
        <div class="filter--bar">
          <button type="button" class="filter--close" aria-label="Close">
            <img src="assets/filter/close.svg" width="26" height="26" alt="">
          </button>
          <button type="button" class="filter--confirm">
            Confirm <img src="assets/filter/check.svg" width="15" height="11.066" alt="">
          </button>
        </div>
        <p class="filter--label">Categories</p>
        <div class="filter--options" id="filter-options"></div>
      </div>
    </div>

    <!-- Frosts the screen behind an opened card -->
    <div class="overlay" id="overlay"></div>

    <!-- An opened card's way back (Figma 350:4211) -->
    <button type="button" class="m-back" id="back" aria-label="Back">
      <img src="assets/system/arrow-back.svg" width="28" height="28" alt="">
    </button>
    <!-- The opened card's name, beside the way back -->
    <p class="m-title" id="title"></p>

    <div class="homebar"></div>
  </div>

  <script src="cards.js?v=21"></script>
  <script src="mobile.js?v=81"></script>
</body>
</html>
