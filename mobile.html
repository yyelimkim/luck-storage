<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#ffffff">
  <title>행운보관소</title>
  <link rel="stylesheet" href="design-system.css?v=5">
  <link rel="stylesheet" href="mobile.css?v=61">
</head>
<body>
  <!-- iPhone 17 screen (Figma 97:630 at rest, 97:730 while dialing), laid out at
       402 x 874 and scaled to fit by mobile.js -->
  <div class="stage" id="stage">
    <!-- Fake status bar: only shown in the desktop preview frame -->
    <div class="status">
      <span class="status--time">9:41</span>
      <img class="status--right" src="assets/mobile/status-right.svg" width="66.661" height="11.3363" alt="">
    </div>

    <header class="head">
      <h1 class="head--title">행운보관소</h1>
      <div class="head--count">
        <img src="assets/mobile/clover.svg" width="27" height="27" alt="">
        <span>12</span>
      </div>
    </header>

    <!-- Cards fan around the dial's centre -->
    <div class="fan" id="fan"></div>

    <!-- Dial: press to open it, turn it to spin the cards -->
    <div class="dial" id="dial" role="slider" aria-label="Cards" tabindex="0">
    </div>

    <!-- Tab bar -->
    <nav class="m-nav" aria-label="Sections">
      <button type="button" class="m-nav--tab" aria-current="page">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true"><path d="M5 12.5 14 5l9 7.5V22a1.5 1.5 0 0 1-1.5 1.5h-5v-6.5h-5v6.5h-5A1.5 1.5 0 0 1 5 22z"/></svg>
        <span>Home</span>
      </button>
      <button type="button" class="m-nav--tab">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true"><circle cx="10.5" cy="9.5" r="3.5"/><path d="M4 22.5c0-3.6 2.9-6.5 6.5-6.5s6.5 2.9 6.5 6.5z"/><circle cx="19" cy="10.5" r="3"/><path d="M18.5 16.1c3.1.3 5.5 2.9 5.5 6.1v.3h-4.5"/></svg>
        <span>Community</span>
      </button>
      <button type="button" class="m-nav--tab">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true"><circle cx="14" cy="9" r="4"/><path d="M6 23c0-4.4 3.6-8 8-8s8 3.6 8 8z"/></svg>
        <span>Profile</span>
      </button>
    </nav>

    <!-- Frosts the screen behind an opened card -->
    <div class="overlay" id="overlay"></div>

    <!-- An opened card's way back (Figma 350:4211) -->
    <button type="button" class="m-back" id="back" aria-label="Back">
      <img src="assets/system/arrow-back.svg" width="28" height="28" alt="">
    </button>
    <!-- The opened card's name, beside the way back -->
    <p class="m-title" id="title"></p>

    <div class="homebar"></div>
  </div>

  <script src="cards.js?v=19"></script>
  <script src="mobile.js?v=63"></script>
</body>
</html>
