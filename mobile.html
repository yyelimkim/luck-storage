<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f0f0f0">
  <title>행운보관소</title>
  <link rel="stylesheet" href="design-system.css?v=5">
  <link rel="stylesheet" href="mobile.css?v=63">
</head>
<body>
  <!-- iPhone 17 screen (Figma 97:630 at rest, 97:730 while dialing), laid out at
       402 x 874 and scaled to fit by mobile.js -->
  <div class="stage" id="stage">
    <!-- Fake status bar: only shown in the desktop preview frame -->
    <div class="status">
      <span class="status--time">9:41</span>
      <img class="status--right" src="assets/mobile/status-right.svg" width="66.661" height="11.3363" alt="">
    </div>

    <!-- Header (Figma 376:5496): which cards, and the luck claimed so far -->
    <header class="head">
      <button type="button" class="head--title">
        <h1>All Cards</h1>
        <img src="assets/mobile/chevron.svg" width="13.3333" height="7.33333" alt="">
      </button>
      <div class="head--count" id="count">
        <img src="assets/mobile/clover-outline.svg" width="18" height="18" alt="">
        <span id="count-num">12</span>
      </div>
    </header>

    <!-- Cards fan around the dial's centre -->
    <div class="fan" id="fan"></div>

    <!-- Dial: press to open it, turn it to spin the cards -->
    <div class="dial" id="dial" role="slider" aria-label="Cards" tabindex="0">
    </div>

    <!-- Tab bar (Figma 376:5524): icons only, the current one filled -->
    <nav class="m-nav" aria-label="Sections">
      <button type="button" class="m-nav--tab" data-tab="tree" aria-label="Tree">
        <img class="is-off" src="assets/nav/tree-off.svg" width="26" height="26" alt="">
        <img class="is-on" src="assets/nav/tree-on.svg" width="26" height="26" alt="">
      </button>
      <button type="button" class="m-nav--tab" data-tab="home" aria-label="Home" aria-current="page">
        <img class="is-off" src="assets/nav/home-off.svg" width="19.0585" height="20.363" alt="">
        <img class="is-on" src="assets/nav/home-on.svg" width="19.0586" height="20.3634" alt="">
      </button>
      <button type="button" class="m-nav--tab" data-tab="profile" aria-label="Profile">
        <img class="is-off" src="assets/nav/profile-off.svg" width="17.0829" height="18.5" alt="">
        <img class="is-on" src="assets/nav/profile-on.svg" width="17.0829" height="18.5" alt="">
      </button>
    </nav>

    <!-- Frosts the screen behind an opened card -->
    <div class="overlay" id="overlay"></div>

    <!-- An opened card's way back (Figma 350:4211) -->
    <button type="button" class="m-back" id="back" aria-label="Back">
      <img src="assets/system/arrow-back.svg" width="28" height="28" alt="">
    </button>
    <!-- The opened card's name, beside the way back -->
    <p class="m-title" id="title"></p>

    <div class="homebar"></div>
  </div>

  <script src="cards.js?v=19"></script>
  <script src="mobile.js?v=66"></script>
</body>
</html>
