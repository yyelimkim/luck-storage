<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Luck Corner · Demo</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <script>
    // On a phone (or as the installed web app) the phone is real: skip the
    // home-screen mockup and open the app itself (same cut-off as mobile.js)
    if (innerWidth <= 500 || matchMedia('(display-mode: standalone)').matches || navigator.standalone) {
      location.replace('index.html?actual');
    }
  </script>
  <!-- Demo flow: an iPhone home screen (Figma "Apple Home and Lock Screen ·
       iOS", node 6:439, 430 x 932) with Luck Corner in the Shortcuts slot.
       Tap it to launch the app (index.html, in the screen); H goes back home,
       Q (on the home screen) quits the app so the next launch starts cold. -->
  <link rel="stylesheet" href="design-system.css?v=9">
  <link rel="stylesheet" href="demo-switch.css?v=1">
  <script src="demo-switch.js?v=1"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; overflow: hidden;
      background: #f0f0f0;
      font-family: -apple-system, "SF Pro Text", "SF Pro", "Helvetica Neue", sans-serif;
      -webkit-user-select: none; user-select: none;
    }

    /* The phone: a 430 x 932 screen in a black bezel, scaled to fit */
    .device {
      position: absolute; left: 50%; top: 50%;
      width: 458px; height: 960px;
      margin: -480px 0 0 -229px;
      border-radius: 69px;
      background: #0d0d0d;
      box-shadow: 0 0 0 1.5px #3a3a3a inset, 0 30px 80px rgba(0,0,0,.18), 0 6px 18px rgba(0,0,0,.12);
    }
    .device::before, .device::after {
      content: ""; position: absolute; width: 4px; border-radius: 2px; background: #1c1c1c;
    }
    .device::before { left: -3px; top: 190px; height: 66px; box-shadow: 0 86px 0 #1c1c1c; }
    .device::after { right: -3px; top: 245px; height: 104px; }

    .screen {
      position: absolute; left: 14px; top: 14px;
      width: 430px; height: 932px;
      border-radius: 55px;
      overflow: hidden;
      background: #000;
      isolation: isolate;
    }

    /* The demo's keys, under the phone (as the app's own hint in its preview) */
    .demo-hint {
      position: fixed; left: 0; right: 0; bottom: 14px; margin: 0;
      text-align: center;
      font-family: var(--font-display); font-size: 10px; letter-spacing: var(--tracking);
      color: var(--dark-grey);
    }

    /* ---- Home screen (Figma 6:391) ---- */
    .home { position: absolute; inset: 0; transform-origin: 50% 50%; }
    .home { background: var(--system-white); }  /* plain light grey in place of the wallpaper */

    .home--top { position: absolute; left: 0; right: 0; top: 0; padding-top: 54px; }  /* under the status bar */
    .apps { display: flex; flex-direction: column; gap: 42px; padding-top: 40px; }
    .row { display: flex; justify-content: space-between; align-items: flex-start; padding: 0 35px; }
    .row.is-widgets { padding: 0 33px; }

    .app {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      width: 64px; height: 64px;
      border: 0; padding: 0; background: none; font: inherit; cursor: default;
    }
    .app--logo { width: 64px; height: 64px; border-radius: 14px; display: block; flex: none; }
    .app--name, .widget--name {
      font-size: 12px; line-height: 16px; color: #000; white-space: nowrap; text-align: center;
    }
    .app.is-blank { visibility: hidden; }
    .app.is-luck { cursor: pointer; }
    .app.is-luck .app--logo { transition: transform .15s, filter .15s; }
    .app.is-luck:active .app--logo { transform: scale(.92); filter: brightness(.85); }

    /* Widgets: 170 square, 23 corners, white */
    .widget { display: flex; flex-direction: column; align-items: center; gap: 4px; height: 170px; }
    .widget--card {
      position: relative; flex: none;
      width: 170px; height: 170px; border-radius: 23px; overflow: hidden;
      background: #fff; color: #000;
    }
    .widget--card > * { position: absolute; margin: 0; white-space: nowrap; }
    .rounded { font-family: ui-rounded, "SF Pro Rounded", -apple-system, sans-serif; }

    /* Reminders widget */
    .rem--title { left: 16px; top: 11px; font-size: 17px; line-height: 22px; font-weight: 600; letter-spacing: .38px; color: #007bfe; }
    .rem--count { right: 17px; top: 7px; font-size: 24px; font-weight: 600; line-height: normal; }
    .rem--radio { left: 16px; width: 24px; height: 24px; border: 1.5px solid #c7c7cc; border-radius: 100px; }
    .rem--item { left: 51px; display: flex; gap: 1px; align-items: flex-start; line-height: 20px; letter-spacing: .5px; }
    .rem--item span:first-child { font-size: 19px; }
    .rem--item span:last-child { font-size: 15px; }
    .rem--rule {
      left: 15.5px; width: 137px; height: 1px; margin-top: .5px;
      background: repeating-linear-gradient(90deg, #c7c7cc 0 2px, transparent 2px 3px);
      border-radius: 100px;
    }

    /* Calendar widget */
    .cal--day { left: 16px; top: 14px; font-size: 13px; line-height: 16px; font-weight: 600; letter-spacing: -.08px; text-transform: uppercase; color: #ff382b; }
    .cal--date { left: 16px; top: 28px; font-size: 34px; line-height: 41px; letter-spacing: .4px; }
    .cal--events { left: 16px; top: 73px; width: 138px; display: flex; flex-direction: column; gap: 4px; }
    .cal--event { display: flex; gap: 3px; overflow: hidden; }
    .cal--event::before { content: ""; width: 4px; flex: none; border-radius: 100px; background: #1badf8; }
    .cal--details {
      flex: 1; min-width: 0; padding: 0 4px; border-radius: 4px;
      background: rgba(27,173,248,.2); letter-spacing: -.23px;
    }
    .cal--details b { display: block; font-size: 15px; line-height: 20px; font-weight: 600; color: #106895; margin-bottom: -3px; }
    .cal--details span { font-size: 14px; line-height: 19px; letter-spacing: -.15px; color: #168ac6; }
    .cal--details small { font-size: 12px; line-height: 16px; color: #168ac6; }

    /* Bottom: search pill, then the dock */
    .home--bottom { position: absolute; left: 0; right: 0; bottom: 0; }
    .search-wrap { display: flex; justify-content: center; padding-bottom: 29px; }
    .glass {
      -webkit-backdrop-filter: blur(40px); backdrop-filter: blur(40px);
      background: rgba(0,0,0,.06);
    }
    .search {
      height: 30px; padding: 0 11px; border-radius: 40px;
      display: flex; align-items: center; gap: 2px;
      font-size: 12px; line-height: 16px; font-weight: 600; color: #3c3c43;
    }
    .search svg { width: 12px; height: 12px; }
    .dock-wrap { padding: 0 15px 14px; }
    .dock {
      height: 106px; border-radius: 40px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px;
    }

    /* ---- The launched app: grows out of the icon. .launch is the clip,
       .launch--screen the 430 x 932 app inside, scaled whole ---- */
    .launch {
      position: absolute; left: 0; top: 0; width: 430px; height: 932px;
      overflow: hidden; z-index: 5; visibility: hidden;
    }
    .launch--screen {
      position: absolute; left: 0; top: 0; width: 430px; height: 932px;
      transform-origin: 0 0; background: #f0f0f0;
    }
    /* the app runs edge to edge (index.html?embed): its own status bar and
       home indicator take over from the home screen's while it's open */
    .launch iframe {
      position: absolute; left: 0; top: 0; width: 430px; height: 932px;
      border: 0; display: block; background: #f0f0f0;
    }
    .launch--icon {
      position: absolute; inset: 0;
      background: url("assets/icons/app-icon-512.png") center / 106% no-repeat, #2a9f3a;
      pointer-events: none;
    }
    .launch.is-moving iframe { pointer-events: none; }

    /* ---- Status bar (Figma 6:214), above everything ---- */
    .status {
      position: absolute; left: 0; top: 0; width: 430px; z-index: 10; pointer-events: none;
      display: flex; align-items: center; justify-content: center; padding: 0 10px;
    }
    .status--side { flex: 1 0 0; display: flex; justify-content: center; align-items: center; padding: 18px 0 13px; }
    .status--time { font-size: 18px; line-height: 23px; font-weight: 600; letter-spacing: -.44px; color: #000; }
    .status--icons img { filter: invert(1); }  /* the icons are white: dark on the white home screen */
    .status--island { padding: 11px 0 6px; }
    .status--island span { display: block; width: 126px; height: 37px; border-radius: 100px; background: #000; }
    .status--icons { display: flex; gap: 3px; align-items: flex-start; }
    .ic { position: relative; height: 23px; }
    .ic img { position: absolute; display: block; }
    .ic-cell { width: 27px; }
    .ic-cell .bars { position: absolute; inset: 13.04% 9.65% 24.27% 7.41%; overflow: hidden; }
    .ic-cell .bars img { width: auto; height: auto; }
    .ic-wifi { width: 23px; }
    .ic-wifi img { left: 2px; top: 4px; width: 19.114px; height: 13.804px; }
    .ic-batt { width: 36px; }
    .ic-batt img { left: 3px; top: 4px; width: 30.848px; height: 13.955px; }
    .status { transition: opacity .15s; }
    .status.is-hidden { opacity: 0; }

    .indicator {
      position: absolute; left: 50%; bottom: 0; width: 180px; height: 26px; margin-left: -90px;
      z-index: 10; border: 0; padding: 0; background: none; cursor: pointer;
    }
    .indicator::after {
      content: ""; position: absolute; left: 13px; right: 13px; bottom: 8px; height: 5px;
      border-radius: 3px; background: #000;
    }
    /* in the app it's the app's own bar you see; this one just takes the click */
    .indicator.is-on::after { opacity: 0; }
    .indicator:not(.is-on) { pointer-events: none; }
  </style>
</head>
<body>
  <div class="device" id="device">
    <div class="screen" id="screen">

        <div class="home--top">

              <div class="widget">
                <div class="widget--card rounded">

              <div class="app"><img class="app--logo" src="assets/demo/podcasts.png" alt=""><span class="app--name">Podcasts</span></div>

      <div class="launch" id="launch">
        <div class="launch--screen" id="launch-screen"></div>
        <div class="launch--icon" id="launch-icon"></div>
      </div>

      <div class="status" id="status">
        <div class="status--side"><span class="status--time" id="time">1:47</span></div>
        <div class="status--island"><span></span></div>
        <div class="status--side">
          <div class="status--icons">
            <div class="ic ic-cell"><div class="bars">
              <img src="assets/demo/bar-empty.svg" alt="" style="inset:75.47% .05% .06% 83.23%">
              <img src="assets/demo/bar4.svg" alt="" style="inset:0 0 .06% 83.25%">
              <img src="assets/demo/bar-empty.svg" alt="" style="inset:75.47% 27.78% .06% 55.5%">
              <img src="assets/demo/bar3.svg" alt="" style="inset:22.74% 27.76% .06% 55.52%">
              <img src="assets/demo/bar-empty.svg" alt="" style="inset:75.47% 55.51% .06% 27.77%">
              <img src="assets/demo/bar2.svg" alt="" style="inset:43.58% 55.52% .06% 27.76%">
              <img src="assets/demo/bar-empty.svg" alt="" style="inset:75.47% 83.28% .06% 0">
              <img src="assets/demo/bar1.svg" alt="" style="inset:61.6% 83.28% .06% 0">
            </div></div>

  <p class="demo-hint" id="hint"></p>

  <script>
  (() => {
    const W = 430, H = 932, RADIUS_ICON = 14, RADIUS_SCREEN = 55;
    const device = document.getElementById('device');
    const screen = document.getElementById('screen');
    const home = document.getElementById('home');
    const luck = document.getElementById('luck');
    const luckLogo = luck.querySelector('.app--logo');
    const launch = document.getElementById('launch');
    const launchScreen = document.getElementById('launch-screen');
    const launchIcon = document.getElementById('launch-icon');
    const status = document.getElementById('status');
    const indicator = document.getElementById('indicator');

    // Fit the phone to the window
    let scale = 1;
    function fit() {
      // room under the phone for the hint: it sits a touch high
      scale = Math.min((innerHeight - 76) / 960, (innerWidth - 40) / 458, 1.2);
      device.style.transform = `translateY(-14px) scale(${scale})`;
    }
    addEventListener('resize', fit); fit();

    // Live clock
    (function tick() {
      const d = new Date();
      document.getElementById('time').textContent = `${d.getHours() % 12 || 12}:${String(d.getMinutes()).padStart(2, '0')}`;
      setTimeout(tick, (60 - d.getSeconds()) * 1000);
    }());

    // The icon's rect in screen px (measured while the home screen is at rest)
    let icon = { x: 0, y: 0, w: 64, h: 64 };
    function measure() {
      const s = screen.getBoundingClientRect(), r = luckLogo.getBoundingClientRect();
      icon = { x: (r.left - s.left) / scale, y: (r.top - s.top) / scale, w: r.width / scale, h: r.height / scale };
    }

    // ---- The app, in an iframe made on first launch (so its splash plays then)
    let frame = null;
    function makeFrame() {
      frame = document.createElement('iframe');
      frame.title = 'Luck Corner';
      frame.src = 'index.html?embed';
      frame.addEventListener('load', () => {
        try { frame.contentWindow.addEventListener('keydown', onKey); } catch (e) {}
      });
      launchScreen.appendChild(frame);
    }
    function quit() { if (frame) { frame.remove(); frame = null; } }

    // ---- The zoom: p = 0 at the icon, 1 full screen; a near-critical spring
    let p = 0, v = 0, target = 0, raf = 0, last = 0;
    const lerp = (a, b, t) => a + (b - a) * t;
    const clamp01 = (t) => Math.min(1, Math.max(0, t));
    function render() {
      const x = lerp(icon.x, 0, p), y = lerp(icon.y, 0, p), w = lerp(icon.w, W, p), h = lerp(icon.h, H, p);
      const k = w / W;
      launch.style.left = `${x}px`; launch.style.top = `${y}px`;
      launch.style.width = `${w}px`; launch.style.height = `${h}px`;
      launch.style.borderRadius = `${lerp(RADIUS_ICON, RADIUS_SCREEN, clamp01(p))}px`;
      launchScreen.style.transform = `translateY(${(h - H * k) / 2}px) scale(${k})`;
      launchIcon.style.opacity = Math.max(0, 1 - Math.max(0, p) * 2.6);
      const q = clamp01(p);
      home.style.transform = q > 0.001 ? `scale(${1 + 0.1 * q})` : '';
      home.style.filter = q > 0.01 ? `blur(${q * 10}px) brightness(${1 - q * 0.25})` : '';
      const shown = p > 0.001 || target === 1;
      launch.style.visibility = shown ? 'visible' : 'hidden';
      luckLogo.style.opacity = shown ? 0 : 1;
      status.classList.toggle('is-hidden', p > 0.12);
      indicator.classList.toggle('is-on', target === 1 && p > 0.5);
    }
    function step(now) {
      const dt = Math.min(0.032, (now - last) / 1000); last = now;
      const STIFF = 230, DAMP = 29;
      for (let i = 0; i < 4; i++) {
        const a = -STIFF * (p - target) - DAMP * v;
        v += a * dt / 4; p += v * dt / 4;
      }
      if (Math.abs(p - target) < 0.0008 && Math.abs(v) < 0.01) { p = target; v = 0; }
      render();
      if (p !== target || v !== 0) raf = requestAnimationFrame(step);
      else { raf = 0; launch.classList.remove('is-moving'); if (target === 1 && frame) frame.focus(); }
    }
    function go(to) {
      target = to;
      launch.classList.add('is-moving');
      if (!raf) { last = performance.now(); raf = requestAnimationFrame(step); }
    }
    function open() {
      if (target === 1) return;
      if (p === 0) measure();
      if (!frame) makeFrame();
      go(1);
    }
    function goHome() {
      if (target === 0) return;
      window.focus();
      go(0);
    }

    // ---- The hint: on the home screen, how to open the app; in it, the
    // app's own demo keys (onboarding's or the app's) and H for home
    const hint = document.getElementById('hint');
    function updateHint() {
      let text = 'Demo: click Luck Corner to open';
      if (target === 1 && frame) {
        text = 'Demo: H for home';
        try {
          const doc = frame.contentDocument;
          const span = [...doc.querySelectorAll('#demo-hint span')].find((el) => getComputedStyle(el).display !== 'none');
          if (span) text = `${span.textContent.trim()} · H for home`;
        } catch (e) {}
      }
      if (hint.textContent !== text) hint.textContent = text;
      setTimeout(updateHint, 250);
    }
    updateHint();

    // ---- Input
    luck.addEventListener('click', open);
    indicator.addEventListener('click', goHome);
    function onKey(e) {
      const t = e.target;
      if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === 'h' || e.key === 'H') { e.preventDefault(); goHome(); }
      else if ((e.key === 'q' || e.key === 'Q') && target === 0 && p === 0) quit();
    }
    addEventListener('keydown', onKey);

    render();
  })();
  </script>
</body>
</html>
