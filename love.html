<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Love Me, Love Me Not</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="design-system.css?v=9">
  <link rel="stylesheet" href="love.css?v=1">
</head>
<body>
  <!-- Love me, love me not: the card's flower (Figma 234:1619 — its Sky
       Blue petals with their dark undersides, the pale yellow middle, the
       black stem), seen face on so each petal can be plucked. Say who you're
       thinking of, then pluck: loves me, loves me not... it has an odd number
       of petals, so it always ends on love. -->
  <main class="love" id="love" data-step="ask">
    <div class="love--flower" id="flower">
      <svg viewBox="-160 -160 320 470" aria-label="A flower" role="img">
        <path class="love--stem" d="M-4 40C-10 120 -30 210 -60 310"/>
        <g id="petals"></g>
        <circle class="love--middle" r="36"/>
      </svg>
      <img class="love--hand" id="hand" src="assets/candles/hand.svg" alt="">
    </div>

    <!-- What this step is, at the rituals' spot, and under it the field -->
    <div class="love--words" role="status">
      <p class="love--say" id="say">Who are you thinking of?</p>
    </div>
    <form class="love--field" id="ask-form">
      <input id="name" type="text" maxlength="24" placeholder="Their name" autocomplete="off" aria-label="Who are you thinking of?">
      <button type="submit" class="love--send" id="send" aria-label="Start plucking" disabled>
        <svg width="20" height="20" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13V3M3.5 7.5L8 3l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </form>
  </main>
  <script src="sounds.js?v=18"></script>
  <script src="love.js?v=1"></script>
</body>
</html>
