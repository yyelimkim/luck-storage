<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Love Me, Love Me Not</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">

<body>
  <!-- Love me, love me not: the card's own flower (Figma 234:1619), each of
       its petals pluckable, with one more set back behind the middle so there
       are five: say who you're thinking of, then pluck — loves me, loves me
       not... an odd number, so it always ends on love. -->

    <div class="love--flower" id="flower">
      <svg viewBox="0 0 325.445 469.139" aria-label="A flower" role="img">
          <!-- only the stem fades away, into the words below -->

            <mask id="stem-fade" maskUnits="userSpaceOnUse" x="0" y="0" width="326" height="470"><rect width="326" height="470" fill="url(#stem-grad)"/></mask>
          </defs>

          <path mask="url(#stem-fade)" d="M161.451 142.975C164.716 139.228 170.401 138.838 174.148 142.104C177.895 145.37 178.285 151.054 175.019 154.801C138.56 196.631 61.5748 316.99 48.1957 460.225C47.7334 465.174 43.3468 468.811 38.3978 468.349C33.4489 467.887 29.8116 463.5 30.2738 458.551C44.0947 310.586 123.243 186.811 161.451 142.975Z" fill="#272727" stroke="#272727" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M168 146L184 100" stroke="#272727" stroke-width="18" stroke-linecap="round"/>

          <g class="love--petal" tabindex="0" role="button" aria-label="Petal 3" data-silent><path class="top" d="M149.143 58.1423C166.884 73.9476 178.194 93.5458 182.163 112.427C186.133 131.309 182.756 149.42 171.215 162.375C159.674 175.33 142.072 180.767 122.859 178.997C103.646 177.226 82.8767 168.246 65.1353 152.441C47.3939 136.635 36.0838 117.037 32.1146 98.1556C28.1454 79.2737 31.5217 61.1629 43.0627 48.2081C54.6037 35.2533 72.2058 29.8158 91.419 31.5863C110.632 33.3568 131.401 42.3371 149.143 58.1423Z" fill="#11B2E4" stroke="#272727" stroke-width="1.5"/></g>

          <g class="love--petal" tabindex="0" role="button" aria-label="Petal 5" data-silent><path d="M175.296 113.109C195.588 123.268 211.024 138.255 219.595 154.24C228.166 170.227 229.845 187.146 222.772 201.274C215.699 215.402 201.148 224.196 183.213 226.913C165.28 229.63 144.031 226.252 123.74 216.094C103.448 205.935 88.0121 190.947 79.4415 174.963C70.8699 158.976 69.1915 142.056 76.2642 127.928C83.337 113.801 97.8884 105.006 115.824 102.289C133.756 99.5728 155.005 102.951 175.296 113.109Z" fill="#272727" stroke="#272727" stroke-width="1.5"/><path class="top" d="M181.633 103.176C202.88 113.814 218.928 129.747 227.713 146.876C236.498 164.006 238.002 182.277 230.287 197.687C222.572 213.098 207.043 222.842 188.065 226.073C169.088 229.303 146.716 226.003 125.468 215.366C104.22 204.729 88.173 188.795 79.3879 171.666C70.6025 154.537 69.0991 136.265 76.8139 120.855C84.5286 105.445 100.058 95.7002 119.036 92.4697C138.013 89.2394 160.385 92.5393 181.633 103.176Z" fill="#11B2E4" stroke="#272727" stroke-width="1.5"/></g>
        </svg>
    </div>

    <!-- What this step is, at the rituals' spot, and under it the field -->
    <div class="love--words" role="status">
      <p class="love--say" id="say">Who are you thinking of?</p>
    </div>
    <form class="love--field" id="ask-form">
      <input id="name" type="text" maxlength="24" placeholder="Their name" autocomplete="off" aria-label="Who are you thinking of?">
      <button type="submit" class="love--send" id="send" aria-label="Start plucking" disabled>
        <svg width="20" height="20" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13V3M3.5 7.5L8 3l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </form>
  </main>
  <script src="sounds.js?v=24"></script>
  <script src="pointer.js?v=1"></script>
  <script src="love.js?v=6"></script>
</body>
</html>
